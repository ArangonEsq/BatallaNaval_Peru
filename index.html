<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batalla Naval · Guerra de Continentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --bg:#e9f0f4; --panel:#ffffff; --panel2:#f3f7fa; --ink:#0b1f2e; --mute:#5a7081; --line:#cbd9e2;
  --sea:#c9e3f1; --sea-line:#b3d3e6; --ship:#52687a; --ship2:#3f5262; --hit:#d92d27; --miss:#ffffff;
  --accent:#0b72b5; --accent-ink:#fff; --good:#16a34a; --warn:#d97706;
  --disp:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050f18; --panel:#0b2031; --panel2:#0e2a40; --ink:#e4f1fa; --mute:#8aa8bd; --line:#183a52;
    --sea:#0c3553; --sea-line:#0f4264; --ship:#a3b8c8; --ship2:#7f97a9; --hit:#ff4b44; --miss:#cfe7f7;
    --accent:#3aa7ee; --accent-ink:#031420;
  }
}
:root[data-theme="dark"]{
  --bg:#050f18; --panel:#0b2031; --panel2:#0e2a40; --ink:#e4f1fa; --mute:#8aa8bd; --line:#183a52;
  --sea:#0c3553; --sea-line:#0f4264; --ship:#a3b8c8; --ship2:#7f97a9; --hit:#ff4b44; --miss:#cfe7f7;
  --accent:#3aa7ee; --accent-ink:#031420;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;
  background-image:radial-gradient(circle at 15% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 45%),
  repeating-linear-gradient(0deg,transparent 0 39px,color-mix(in srgb,var(--line) 45%,transparent) 39px 40px)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:.02em}
code{font-family:var(--mono)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(6px);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.brand .anchor{font-size:1.6rem}
.brand b{font-family:var(--disp);letter-spacing:.14em;font-size:1.05rem;display:block;line-height:1.1}
.brand small{color:var(--mute);font-size:.78rem}
.tr{display:flex;align-items:center;gap:10px}
.dbdot{width:9px;height:9px;border-radius:50%;background:var(--warn)}
.dbdot.ok{background:var(--good)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:.82rem;color:var(--mute)}
.ghost:hover{color:var(--ink);border-color:var(--mute)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 20px;font-family:var(--disp);font-weight:700;letter-spacing:.06em;font-size:1rem;text-transform:uppercase}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:var(--hit);color:#fff}
.btn.big{padding:16px 28px;font-size:1.15rem}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 40px}
.center{display:grid;place-items:center;min-height:60vh;text-align:center;color:var(--mute)}

/* landing */
.hero{text-align:center;padding:36px 0 22px}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);letter-spacing:.08em;line-height:1}
.hero p{color:var(--mute);max-width:46ch;margin:12px auto 0}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:26px}
.role{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:26px 22px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:.15s}
.role:hover{border-color:var(--accent);transform:translateY(-2px)}
.role .ic{font-size:2.4rem}
.role h2{font-size:1.5rem}
.role p{margin:0;color:var(--mute);font-size:.92rem}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h3{font-size:1.05rem;margin-bottom:10px;letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--mute);font-size:.9rem}

/* host setup */
.hs{display:grid;grid-template-columns:1fr 340px;gap:18px}
@media(max-width:860px){.hs{grid-template-columns:1fr}}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;align-content:start}
.slot{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--tc,var(--line));border-radius:14px;padding:18px;display:flex;align-items:center;gap:14px;min-height:112px;position:relative}
.slot.empty{border-style:dashed;border-left-width:1px;color:var(--mute);justify-content:center;background:transparent}
.slot .em{font-size:2.6rem}
.slot h3{font-size:1.2rem}
.slot p{margin:0;color:var(--mute);font-size:.88rem}
.badge{position:absolute;top:10px;right:12px;font-size:.72rem;font-family:var(--mono);padding:3px 8px;border-radius:99px;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.badge.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border-color:var(--good)}
.steps{margin:0 0 14px;padding-left:1.2em;color:var(--mute);font-size:.92rem}
.steps li{margin:4px 0}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--panel2);border-radius:10px;margin:12px 0;font-size:.9rem;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px}

/* boards */
.board{container-type:inline-size;display:grid;grid-template-columns:1.5em repeat(10,minmax(0,1fr));gap:2px;font-family:var(--mono);user-select:none;-webkit-user-select:none;width:100%}
.lab{display:grid;place-items:center;font-size:3.4cqw;color:var(--mute);aspect-ratio:auto;min-height:1.3em}
.cell{aspect-ratio:1;background:var(--sea);border-radius:3px;position:relative;display:grid;place-items:center;
  background-image:linear-gradient(135deg,transparent 0 46%,var(--sea-line) 46% 54%,transparent 54%);background-size:100% 100%;background-blend-mode:normal}
.board.clk .cell:not(.hit):not(.miss):hover,.board.pl .cell:hover{outline:2px solid var(--accent);outline-offset:-2px;cursor:pointer}
.cell.ship{background:linear-gradient(160deg,var(--ship),var(--ship2));background-image:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.cell.sunk{background:#4d0f12;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1px #000}
.cell.hit::after{content:"✕";color:#fff;font-weight:700;font-size:6.2cqw;line-height:1;text-shadow:0 0 6px var(--hit);animation:pop .45s ease-out}
.cell.hit:not(.sunk){background:var(--hit);background-image:none}
.cell.miss::after{content:"";width:30%;aspect-ratio:1;border-radius:50%;border:2px solid var(--miss);opacity:.85;animation:ripple .6s ease-out}
.cell.sel{outline:3px solid var(--accent);outline-offset:-3px;animation:blink 1s infinite}
.cell.sel::before{content:"⌖";position:absolute;font-size:6.5cqw;color:var(--accent);font-weight:700}
.cell.last{animation:lastp 1.1s ease-in-out infinite;z-index:2}
.cell.pv{outline:2px solid var(--good);outline-offset:-2px;background:color-mix(in srgb,var(--good) 55%,var(--sea))}
.cell.pvbad{outline:2px solid var(--hit);outline-offset:-2px;background:color-mix(in srgb,var(--hit) 45%,var(--sea))}
@keyframes pop{0%{transform:scale(2.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes ripple{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:.85}}
@keyframes blink{50%{outline-color:transparent}}
@keyframes lastp{0%,100%{box-shadow:0 0 0 0 #ffd24a}50%{box-shadow:0 0 0 5px #ffd24a,0 0 14px 4px #ffd24a}}

/* host battle */
.hbwrap{display:grid;grid-template-columns:1fr 330px;gap:18px;max-width:1500px;margin:0 auto;padding:16px 18px 30px}
@media(max-width:1000px){.hbwrap{grid-template-columns:1fr}}
.hbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--panel);border:1.5px solid var(--line);font-size:.85rem;font-weight:500}
.chip.cur{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 22%,var(--panel));font-weight:600;box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 28%,transparent)}
.chip.dead{opacity:.45;text-decoration:line-through}
.chip.me{border-style:dashed}
.chip .num{font-family:var(--mono);font-size:.72rem;color:var(--mute)}
.bn{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;padding:14px 18px;border-radius:14px;background:var(--panel);border:2px solid var(--line);margin-bottom:14px;font-family:var(--disp);font-size:clamp(1rem,2.4vw,1.7rem);animation:slide .5s ease-out;text-align:center}
.bn .co{font-family:var(--mono);background:var(--panel2);padding:2px 12px;border-radius:8px;font-weight:600}
.bn strong{letter-spacing:.08em;padding:3px 14px;border-radius:8px;color:#fff}
.bn.agua{border-color:var(--accent)}.bn.agua strong{background:var(--accent);color:var(--accent-ink)}
.bn.tocado{border-color:var(--hit);box-shadow:0 0 22px color-mix(in srgb,var(--hit) 45%,transparent)}.bn.tocado strong{background:var(--hit)}
.bn.hundido{border-color:#ffb020;box-shadow:0 0 30px rgba(255,176,32,.5)}.bn.hundido strong{background:#b45309}
.bn.idle{color:var(--mute);font-size:1.1rem}
@keyframes slide{from{transform:translateY(-12px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.hboards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px}
.hb{background:var(--panel);border:2px solid var(--line);border-top:7px solid var(--tc);border-radius:14px;padding:12px;position:relative;transition:.25s}
.hb.turn{box-shadow:0 0 0 3px var(--tc),0 0 28px color-mix(in srgb,var(--tc) 45%,transparent)}
.hb.dead .board{opacity:.55}
.hbh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.hbh .e{font-size:1.5rem}
.hbh b{font-family:var(--disp);font-size:1.15rem}
.hbh em{font-style:normal;color:var(--mute);font-size:.82rem}
.hbh .left{margin-left:auto;font-family:var(--mono);font-size:.85rem;background:var(--panel2);border-radius:8px;padding:2px 9px}
.tag{position:absolute;top:-1px;right:12px;transform:translateY(-100%);background:var(--tc);color:#fff;font-family:var(--disp);font-size:.72rem;letter-spacing:.1em;padding:2px 10px;border-radius:6px 6px 0 0;margin-top:-7px}
.hb .x{position:absolute;inset:50% 0 auto 0;transform:translateY(-50%) rotate(-8deg);text-align:center;font-family:var(--disp);font-size:2rem;letter-spacing:.2em;color:var(--hit);text-shadow:0 2px 6px rgba(0,0,0,.5);pointer-events:none}
.hside{display:flex;flex-direction:column;gap:14px}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow-y:auto}
.f{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 10px;background:var(--panel2);border-left:4px solid var(--tc,var(--line));border-radius:8px;font-size:.86rem}
.f .n{font-family:var(--mono);color:var(--mute);font-size:.74rem}
.f em{font-style:normal;font-family:var(--disp);font-weight:700;font-size:.78rem;letter-spacing:.06em}
.f.tocado em{color:var(--hit)}.f.hundido em{color:#ffb020}.f.agua em{color:var(--accent)}
.f.none{display:block;color:var(--mute);text-align:center}

/* overlays */
#ov{position:fixed;inset:0;background:rgba(2,10,18,.82);display:none;place-items:center;z-index:50;padding:20px}
#ov.on{display:grid}
.ovbox{background:var(--panel);border:2px solid var(--accent);border-radius:18px;padding:26px;max-width:880px;width:100%;text-align:center}
.ovbox h2{font-size:clamp(1.4rem,4vw,2.2rem);letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}
.ordrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.ocard{background:var(--panel2);border:3px solid var(--tc);border-radius:14px;padding:14px 18px;min-width:130px;animation:drop .6s cubic-bezier(.2,1.4,.4,1) both}
.ocard b{display:block;font-family:var(--disp);font-size:2.2rem;color:var(--tc)}
.ocard span{font-size:2.2rem}
.ocard p{margin:4px 0 0;font-weight:600}
@keyframes drop{from{transform:translateY(-60px) scale(.5);opacity:0}to{transform:none;opacity:1}}
.trophy{font-size:5rem;animation:pop .8s}

/* join */
.join{max-width:720px;margin:0 auto}
.fld{display:block;margin:14px 0}
.fld span{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin-bottom:6px;font-family:var(--disp)}
.fld input{width:100%;padding:12px 14px;font:inherit;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.fld input:focus{outline:2px solid var(--accent);border-color:transparent}
.conts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cc{background:var(--panel);border:2px solid var(--line);border-top:7px solid var(--tc);border-radius:14px;padding:16px;text-align:left;display:flex;gap:12px;align-items:center}
.cc:hover:not(:disabled){border-color:var(--tc);transform:translateY(-2px)}
.cc:disabled{opacity:.45;cursor:not-allowed;border-top-color:var(--line)}
.cc .e{font-size:2.4rem}
.cc b{font-family:var(--disp);font-size:1.15rem;display:block}
.cc small{color:var(--mute)}

/* team views */
.tbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.me-chip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:12px;padding:8px 14px}
.me-chip .e{font-size:1.6rem}
.me-chip b{font-family:var(--disp);display:block;line-height:1.1}
.me-chip small{color:var(--mute)}
.turnbox{flex:1;min-width:220px;text-align:center;padding:12px 16px;border-radius:12px;background:var(--panel);border:2px solid var(--line);font-family:var(--disp);font-size:1.15rem;letter-spacing:.06em}
.turnbox.mine{border-color:var(--good);background:color-mix(in srgb,var(--good) 20%,var(--panel));animation:glow 1.4s ease-in-out infinite;font-size:1.35rem}
.turnbox.over{border-color:#ffb020}
@keyframes glow{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--good) 35%,transparent)}}
.tabs{display:flex;gap:6px;margin:12px 0}
.tab{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-family:var(--disp);letter-spacing:.06em;text-transform:uppercase;font-size:.9rem}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tgts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tg{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--panel);font-weight:500}
.tg.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 22%,var(--panel))}
.tg.dead{opacity:.4;text-decoration:line-through}
.tg small{font-family:var(--mono);color:var(--mute)}
.atk{max-width:620px;margin:0 auto}
.fire{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.fire .sel{font-family:var(--mono);background:var(--panel2);border-radius:8px;padding:8px 12px;min-width:150px}
.fire .btn{flex:1;min-width:160px}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media(max-width:860px){.twocol{grid-template-columns:1fr}}

/* setup */
.shop{display:grid;gap:8px;max-width:640px;margin:0 auto}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.row .nm{font-weight:600}
.row .nm small{display:block;color:var(--mute);font-weight:400}
.blks{display:flex;gap:2px;margin-top:4px}
.blk{width:16px;height:16px;border-radius:3px;background:linear-gradient(160deg,var(--ship),var(--ship2));display:inline-block}
.qty{display:flex;align-items:center;gap:10px;font-family:var(--mono)}
.qty button{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel2);font-size:1.2rem;font-weight:700;line-height:1}
.qty button:disabled{opacity:.3;cursor:not-allowed}
.pts{display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:0 auto 12px;padding:12px 16px;background:var(--panel);border-radius:12px;border:1px solid var(--line);font-family:var(--disp);font-size:1.1rem}
.pts b{color:var(--accent);font-size:1.5rem}
.place{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:760px){.place{grid-template-columns:1fr}}
.fl{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.fl li{padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem}
.fl li.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel2))}
.fl li.done{color:var(--mute)}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ctrls .btn{padding:9px 8px;font-size:.82rem}
.pbw{max-width:560px;width:100%;margin:0 auto}
.stat{margin-top:10px;font-size:.9rem;color:var(--mute);text-align:center}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;z-index:60;pointer-events:none;font-size:.92rem;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}

.codebox{text-align:center;margin-bottom:14px}
.codebox .code{font-family:var(--mono);font-weight:600;font-size:clamp(2.2rem,6vw,3.4rem);letter-spacing:.25em;color:var(--accent);background:var(--panel2);border:2px dashed var(--accent);border-radius:14px;padding:6px 16px 6px 26px;display:inline-block}
.codebox small{display:block;color:var(--mute);margin-top:6px;word-break:break-all}
#qr{display:grid;place-items:center;margin:10px auto 0}
#qr img,#qr canvas{background:#fff;padding:8px;border-radius:10px}
.cin{font-family:var(--mono);font-size:1.8rem;text-align:center;letter-spacing:.3em;text-transform:uppercase}
.off{font-size:.8rem;color:var(--warn)}
.codechip{font-family:var(--mono);letter-spacing:.18em;font-size:.85rem;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px}
/* ---- mapa SVG ---- */
.mapwrap{overflow:auto;border-radius:10px;border:1px solid var(--line);background:var(--sea);max-height:78vh;-webkit-overflow-scrolling:touch}
.wmap{display:block;width:100%;height:auto;font-family:var(--mono)}
.wmap .sea{fill:var(--sea)}
.wmap .landg{opacity:.6}
.wmap .lf{fill-rule:evenodd}
.wmap .coast{fill:none;stroke:var(--coast);stroke-width:.7;stroke-linejoin:round}
.wmap .gridl{fill:none;stroke:var(--gridline);stroke-width:.45}
.wmap .lbl{font-size:8px;fill:var(--mute);text-anchor:middle;font-weight:600}
.wmap .dim{fill:rgba(0,0,0,.42)}
.wmap .zin{fill:none;stroke:var(--accent);stroke-width:.6;stroke-opacity:.5}
.wmap .ownship{stroke:#000;stroke-opacity:.55;stroke-width:1;fill-opacity:1}
.wmap .sunkship{fill-opacity:.35;stroke:#000;stroke-width:1;stroke-dasharray:3 2}
.wmap .miss{fill:none;stroke-width:1.8}
.wmap .hitc{fill:var(--hit);fill-opacity:.8;stroke-width:1.8}
.wmap .hitc.hundido{fill:#7a0f12;fill-opacity:.95}
.wmap .xm{stroke:#fff;stroke-width:2;stroke-linecap:round;fill:none}

@keyframes lastsvg{50%{stroke-opacity:.15}}
.wmap .cross{fill:rgba(255,210,74,.35);stroke:#ffd24a;stroke-width:1.5}

.wmap .pc.pv{fill:rgba(22,163,74,.55);stroke:#16a34a;stroke-width:1}

.lg{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:8px 10px;margin-bottom:6px;border-left:6px solid var(--tc);background:var(--panel2);border-radius:8px}

function parseCoord(raw){
  const s=String(raw||'').toUpperCase().replace(/[\s,;:.\-_\/()]/g,'');
  let m=s.match(/^([A-Z])(\d{1,3})$/),L,D;
  if(m){L=m[1];D=+m[2]}
  else{m=s.match(/^(\d{1,3})([A-Z])$/);if(m){D=+m[1];L=m[2]}else return {ok:false,why:'formato'}}
  const r=LETS.indexOf(L),c=D-1;
  if(r<0||D<1||D>COLS)return {ok:false,why:'fuera_de_rango',r:r>=0?r:'',c:D>=1?c:''};
  return {ok:true,r,c};
}

function shipAtCell(tid,r,c){return (H.G.fleets[tid]||[]).find(s=>s.cells.some(([a,b])=>a===r&&b===c))}
function teamAlive(tid,hit){return (H.G.fleets[tid]||[]).some(s=>!s.cells.every(([a,b])=>hit.has(a+','+b)))}
function hostNext(from,hit){
  const o=H.G.order,i=o.indexOf(from);
  for(let k=1;k<=o.length;k++){const id=o[(i+k)%o.length];if(teamAlive(id,hit))return id}
  return from;
}
function validFleet(f,team){
  if(!Array.isArray(f)||f.length<1||f.length>30)return false;
  let cost=0;const cnt={},occ=new Set();
  for(const s of f){
    const def=s&&SHIP[s.k];
    if(!def||s.len!==def.len||!Array.isArray(s.cells)||s.cells.length!==def.len)return false;
    cost+=def.cost;cnt[s.k]=(cnt[s.k]||0)+1;if(cnt[s.k]>def.max)return false;
    for(const c of s.cells){
      if(!Array.isArray(c)||!Number.isInteger(c[0])||!Number.isInteger(c[1])||c[0]<0||c[1]<0||c[0]>=ROWS||c[1]>=COLS)return false;
      if(zoneAt(c[0],c[1])!==team)return false;
      const k=c[0]+','+c[1];if(occ.has(k))return false;occ.add(k);
    }
    const rs=s.cells.map(c=>c[0]),cs=s.cells.map(c=>c[1]);
    const sameR=rs.every(v=>v===rs[0]),sameC=cs.every(v=>v===cs[0]);
    if(!sameR&&!sameC)return false;
    const arr=sameR?cs:rs;
    if(Math.max(...arr)-Math.min(...arr)!==def.len-1)return false;
  }
  return cost<=budgetOf(team,H.G.eq);
}

function onHostMsg(conn,m){
  if(!m||typeof m!=='object')return;
  const G=H.G,send=x=>{try{conn.send(x)}catch(e){}};
  if(m.t==='hello'){
    const id=Object.keys(G.teams).find(i=>G.teams[i].token===m.token);
    if(id){H.teamConn[id]=conn;send({t:'welcome',id,fleet:G.fleets[id]||null});bcast()}
    else send({t:'welcome',id:null});
    return;
  }
  if(m.t==='join'){
    const token=String(m.token||'').slice(0,40);
    if(!token||!CONT[m.cont])return;
    const ex=Object.keys(G.teams).find(i=>G.teams[i].token===token);
    if(ex){H.teamConn[ex]=conn;send({t:'welcome',id:ex,fleet:G.fleets[ex]||null});bcast();return}
    if(G.phase!=='setup')return send({t:'err',msg:'La partida ya empezó'});
    if(G.teams[m.cont])return send({t:'err',msg:'Ese continente ya fue elegido'});
    if(Object.keys(G.teams).length>=4)return send({t:'err',msg:'Ya hay 4 equipos'});
    const name=String(m.name||'').trim().slice(0,24)||('Equipo '+CONT[m.cont].name);
    G.teams[m.cont]={name,token,ready:false,joinedAt:Date.now()};
    H.teamConn[m.cont]=conn;
    send({t:'welcome',id:m.cont,fleet:null});bcast();return;
  }
  const id=teamOfConn(conn);
  if(!id)return send({t:'err',msg:'No estás en la partida'});
  if(m.t==='ready'){
    if(G.phase!=='setup')return;
    if(!validFleet(m.fleet,id))return send({t:'err',msg:'Flota no válida'});
    G.fleets[id]=m.fleet.map(s=>({k:s.k,len:s.len,cells:s.cells.map(c=>[c[0],c[1]])}));
    G.teams[id].ready=true;G.teams[id].readyAt=Date.now();
    send({t:'fleet',fleet:G.fleets[id]});bcast();return;
  }
  if(m.t==='unready'){if(G.phase==='setup'){G.teams[id].ready=false;bcast()}return}
  if(m.t==='fire'){
    if(G.phase!=='battle'||G.turn!==id)return send({t:'bad',msg:'No es tu turno'});
    const raw=String(m.raw==null?'':m.raw).slice(0,24),now=Date.now();
    G.attempt=(G.attempt||0)+1;
    const ev={i:G.events.length+1,ts:now,team:id,turnNo:G.turnNo,att:G.attempt,raw,tms:now-(G.turnStart||now)};
    const p=parseCoord(raw);
    const reject=(tipo)=>{
      ev.tipo=tipo;if(p.r!==undefined&&p.r!=='')ev.r=p.r;if(p.c!==undefined&&p.c!=='')ev.c=p.c;
      G.events.push(ev);send({t:'bad',msg:'«'+raw+'»: '+TIPOS[tipo],tipo});bcast();
    };
    if(!p.ok)return reject(p.why);
    ev.r=p.r;ev.c=p.c;
    const hit=new Set(G.shots.map(x=>x.r+','+x.c));
    if(hit.has(p.r+','+p.c))return reject('repetida');
    if(shipAtCell(id,p.r,p.c))return reject('propia');
    let target='',ship=null;
    for(const tid of G.order){if(tid===id)continue;const s=shipAtCell(tid,p.r,p.c);if(s){target=tid;ship=s;break}}
    let res='agua',sh='';
    if(ship){res='tocado';if(ship.cells.every(([a,b])=>(a===p.r&&b===p.c)||hit.has(a+','+b))){res='hundido';sh=ship.k}}
    const shot={n:G.shots.length+1,by:id,r:p.r,c:p.c,res,to:target};if(sh)shot.sh=sh;
    G.shots=[...G.shots,shot];hit.add(p.r+','+p.c);
    ev.tipo='valido';ev.res=res;ev.to=target;if(sh)ev.sh=sh;G.events.push(ev);
    const alive=G.order.filter(i=>teamAlive(i,hit));
    if(alive.length<=1){G.phase='over';G.winner=alive[0]||id;G.turn=''}
    else{G.turn=(res!=='agua'&&G.again)?id:hostNext(id,hit);G.turnNo++;G.turnStart=Date.now();G.attempt=0}
    bcast();
  }
}

  try{H.peer&&H.peer.destroy()}catch(e){}
  const peer=new Peer(PFX+H.code,PEER_CFG);H.peer=peer;
  peer.on('open',()=>{H.status='ok';H.tries=0;bcast()});
  peer.on('connection',conn=>{
    conn.on('open',()=>{H.peers.add(conn);try{conn.send({t:'pub',pub:P})}catch(e){}});
    conn.on('data',m=>onHostMsg(conn,m));
    const gone=()=>{H.peers.delete(conn);let ch=false;for(const id in H.teamConn)if(H.teamConn[id]===conn){delete H.teamConn[id];ch=true}if(ch)bcast()};
    conn.on('close',gone);conn.on('error',gone);
  });
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{
    if(H.peer!==peer)return;
    if(e.type==='unavailable-id'){
      if(H.resumed&&H.tries++<10)setTimeout(openHostPeer,3000);
      else{H.resumed=false;H.code=genCode();setTimeout(openHostPeer,100)}
    }else if(e.type==='peer-unavailable'||e.type==='webrtc'){/* ignorar */}
    else{H.status='fail';H.err=e.type;render()}
  });
}
function startHost(resume){
  const saved=resume?lsJSON('bn_host'):null;
  H.code=saved?saved.code:genCode();
  H.G=saved?saved.G:newG();
  if(!H.G.events)H.G.events=[];
  H.teamConn={};H.peers=new Set();H.status='wait';H.tries=0;H.resumed=!!saved;H.err='';
  P=makePub();
  openHostPeer();render();
}
function startBattle(){
  const G=H.G,ids=Object.keys(G.teams);
  if(ids.length<2||!ids.every(i=>G.teams[i].ready&&G.fleets[i]))return;
  G.order=shuffle(ids);G.turn=G.order[0];G.turnNo=1;G.turnStart=Date.now();G.attempt=0;G.shots=[];G.events=[];G.winner='';G.phase='battle';bcast();
}
function skipTurn(){const G=H.G;if(G.phase!=='battle')return;G.turn=hostNext(G.turn,new Set(G.shots.map(x=>x.r+','+x.c)));G.turnNo++;G.turnStart=Date.now();G.attempt=0;bcast()}

/* ================== CLIENTE (equipo) ================== */
function tokenFor(code){
  const k='bn_tok_'+code;let t=lsGet(k);
  if(!t){t=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b=>b.toString(16).padStart(2,'0')).join('');lsSet(k,t)}
  return t;
}
const csend=m=>{try{if(CL.conn&&CL.conn.open){CL.conn.send(m);return true}}catch(e){}return false};
function clientRetry(){clearTimeout(CL.rt);CL.rt=setTimeout(clientConnect,2500)}
function clientConnect(){
  if(role!=='team'||!CL.code)return;
  const old=CL.peer;CL.peer=null;CL.conn=null;
  try{old&&old.destroy()}catch(e){}
  CL.status='connecting';CL.token=tokenFor(CL.code);
  const peer=new Peer(undefined,PEER_CFG);CL.peer=peer;
  peer.on('open',()=>{
    if(CL.peer!==peer)return;
    const conn=peer.connect(PFX+CL.code,{reliable:true});CL.conn=conn;
    const to=setTimeout(()=>{if(CL.conn===conn&&!conn.open){CL.err='timeout';clientRetry()}},10000);
    conn.on('open',()=>{clearTimeout(to);CL.status='open';CL.err='';conn.send({t:'hello',token:CL.token});render()});
    conn.on('data',onClientMsg);
    conn.on('close',()=>{if(CL.conn===conn){CL.status='connecting';render();clientRetry()}});
  });
  peer.on('error',e=>{if(CL.peer!==peer)return;CL.err=e.type;CL.status='connecting';render();clientRetry()});
  render();
}
function onClientMsg(m){
  if(!m||typeof m!=='object')return;
  if(m.t==='pub'){P=m.pub;busy=false}
  else if(m.t==='welcome'){CL.myId=m.id;CL.myFleet=m.fleet||null}
  else if(m.t==='fleet'){CL.myFleet=m.fleet}
  else if(m.t==='err'){toast(m.msg);busy=false;if(curView==='team-setup')renderSetup()}
  else if(m.t==='bad'){busy=false;showCoordErr(m.msg)}
  render();
}
function showCoordErr(msg){const e=$('#cerr');if(e){e.textContent='⚠️ '+msg;e.classList.add('on')}const i=$('#coord');if(i){i.focus();i.select()}}
function setCode(code){CL.code=code;ssSet('bn_code',code);CL.myId=null;CL.myFleet=null;P=null;clientConnect()}
function leaveTeam(){
  clearTimeout(CL.rt);const p=CL.peer;CL.peer=null;CL.conn=null;try{p&&p.destroy()}catch(e){}
  CL.code='';CL.status='idle';CL.myId=null;CL.myFleet=null;ssSet('bn_code',null);P=null;
}
function leaveHost(){const p=H.peer;H.peer=null;try{p&&p.destroy()}catch(e){}H.status='idle';H.peers=new Set();H.teamConn={};P=null}

/* ================== derivados ================== */
function derive(){
  const s=st(),me=myId();
  const D={t:{},shot:new Map(),last:s.shots.length?s.shots[s.shots.length-1]:null};
  s.shots.forEach(x=>D.shot.set(x.r+','+x.c,x));
  Object.keys(s.teams).forEach(id=>{
    const tm=s.teams[id];
    let ships;
    if(id===me&&CL.myFleet)ships=CL.myFleet.map(sh=>({...sh,sunk:sh.cells.every(([r,c])=>D.shot.has(r+','+c))}));
    else ships=((s.sunk||{})[id]||[]).map(sh=>({...sh,sunk:true}));
    D.t[id]={ships,left:tm.left,total:tm.total,alive:tm.total>0?tm.left>0:true};
  });
  return D;
}

/* ================== mapa SVG ================== */
function mapDefs(){
  const clips=Object.entries(MAP.clips).map(([k,ps])=>`<clipPath id="cp-${k}">${ps.map(p=>`<polygon points="${p}"/>`).join('')}</clipPath>`).join('');
  let grid='';
  for(let c=0;c<=COLS;c++)grid+=`M${GX0+c*CELL} ${GY0}V${GY0+ROWS*CELL}`;
  for(let r=0;r<=ROWS;r++)grid+=`M${GX0} ${GY0+r*CELL}H${GX0+COLS*CELL}`;
  return `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${clips}<path id="land-p" d="${MAP.land}"/><path id="coast-p" d="${MAP.coast}"/><path id="grid-p" d="${grid}"/></defs></svg>`;
}
const cxp=c=>GX0+c*CELL, cyp=r=>GY0+r*CELL;
/* opts: view{r0,r1,c0,c1}|null, D, own, rects, zone(team), dim(team), pv[[r,c]], pvok, cross[r,c] */
function mapSVG(o={}){
  const D=o.D||derive(),v=o.view;
  const r0=v?v.r0:0,r1=v?v.r1:ROWS-1,c0=v?v.c0:0,c1=v?v.c1:COLS-1;
  const vx=cxp(c0)-LABW,vy=cyp(r0)-LABH,vw=(c1-c0+1)*CELL+LABW+(v?0:0),vh=v?(r1-r0+1)*CELL+LABH:(500-vy);
  let h=`<svg class="wmap" viewBox="${vx} ${vy} ${vw} ${vh}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;
  h+=`<rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" class="sea"/>`;
  h+=`<g class="landg"><use href="#land-p" style="fill:${CONT.asia.color}" class="lf"/>`;
  ['europa','africa','oceania','america'].forEach(k=>{h+=`<use href="#land-p" style="fill:${CONT[k].color}" clip-path="url(#cp-${k})" class="lf"/>`});
  h+=`</g>`;
  h+=`<use href="#coast-p" class="coast"/>`;
  h+=`<use href="#grid-p" class="gridl"/>`;
  // etiquetas
  for(let c=c0;c<=c1;c++)h+=`<text x="${cxp(c)+CELL/2}" y="${cyp(r0)-3}" class="lbl">${c+1}</text>`;
  for(let r=r0;r<=r1;r++)h+=`<text x="${cxp(c0)-LABW/2-1}" y="${cyp(r)+CELL/2+3}" class="lbl">${LETS[r]}</text>`;
  // atenuar fuera de la zona
  if(o.dim){
    let d=`M${cxp(c0)} ${cyp(r0)}h${(c1-c0+1)*CELL}v${(r1-r0+1)*CELL}h${-(c1-c0+1)*CELL}Z`;
    ZCELLS[o.dim].forEach(([r,c])=>{if(r>=r0&&r<=r1&&c>=c0&&c<=c1)d+=`M${cxp(c)} ${cyp(r)}h${CELL}v${CELL}h${-CELL}Z`});
    h+=`<path d="${d}" fill-rule="evenodd" class="dim"/>`;
    ZCELLS[o.dim].forEach(([r,c])=>{if(r>=r0&&r<=r1&&c>=c0&&c<=c1)h+=`<rect x="${cxp(c)}" y="${cyp(r)}" width="${CELL}" height="${CELL}" class="zin"/>`});
  }
  // barcos
  Object.keys(D.t).forEach(id=>{
    D.t[id].ships.forEach(sh=>{
      const own=id===o.own&&!o.hideOwn;
      if(!own&&!sh.sunk)return;
      sh.cells.forEach(([r,c])=>{
        if(r<r0||r>r1||c<c0||c>c1)return;
        h+=`<rect x="${cxp(c)+1}" y="${cyp(r)+1}" width="${CELL-2}" height="${CELL-2}" rx="3" class="${own?'ownship':'sunkship'}" style="fill:${CONT[id].color}"/>`;
      });
    });
  });
  // disparos
  if(o.shots!==false){
    D.shot.forEach(x=>{
      const X=cxp(x.c),Y=cyp(x.r),col=CONT[x.by]?CONT[x.by].color:'#fff';
      if(x.res==='agua')h+=`<circle cx="${X+CELL/2}" cy="${Y+CELL/2}" r="4.2" class="miss" style="stroke:${col}"/>`;
      else h+=`<rect x="${X+1}" y="${Y+1}" width="${CELL-2}" height="${CELL-2}" rx="3" class="hitc ${x.res}" style="stroke:${col}"/><path d="M${X+5} ${Y+5}L${X+CELL-5} ${Y+CELL-5}M${X+CELL-5} ${Y+5}L${X+5} ${Y+CELL-5}" class="xm"/>`;
    });
    if(D.last)h+=`<rect x="${cxp(D.last.c)-1}" y="${cyp(D.last.r)-1}" width="${CELL+2}" height="${CELL+2}" rx="4" class="lastc"/>`;
  }
  if(o.cross)h+=`<rect x="${cxp(o.cross[1])}" y="${cyp(o.cross[0])}" width="${CELL}" height="${CELL}" class="cross"/>`;
  if(o.rects){
    for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)h+=`<rect x="${cxp(c)}" y="${cyp(r)}" width="${CELL}" height="${CELL}" class="pc" data-r="${r}" data-c="${c}"/>`;
  }
  return h+'</svg>';
}

let L={};
function initLocal(){
  L={comp:{},stage:'pick',fleet:[],sel:null,horiz:true,hover:null,flag:null};
  const me=myId(),b=st().bud[me]||14;
  let left=b;[['portaaviones'],['acorazado'],['crucero'],['destructor']].forEach(([k])=>{const s=SHIP[k];if(left>=s.cost){L.comp[k]=1;left-=s.cost}});
  const f=CL.myFleet;
  if(f){L.fleet=f.map(s=>({k:s.k,len:s.len,cells:s.cells}));L.stage='place';L.comp={};f.forEach(s=>L.comp[s.k]=(L.comp[s.k]||0)+1)}
}
const myBudget=()=>st().bud[myId()]||14;
const spent=()=>SHIPS.reduce((a,s)=>a+s.cost*(L.comp[s.k]||0),0);
const countShips=()=>SHIPS.reduce((a,s)=>a+(L.comp[s.k]||0),0);
function buildFleet(){L.fleet=[];SHIPS.forEach(s=>{for(let i=0;i<(L.comp[s.k]||0);i++)L.fleet.push({k:s.k,len:s.len,cells:null})});L.sel=0;L.horiz=true}
const cellsFor=(len,r,c,h)=>Array.from({length:len},(_,i)=>h?[r,c+i]:[r+i,c]);
function occMap(){const m=new Map();L.fleet.forEach((s,i)=>s.cells&&s.cells.forEach(([r,c])=>m.set(r+','+c,i)));return m}
function validPlace(cs){const me=myId(),m=occMap();return cs.every(([r,c])=>r>=0&&c>=0&&r<ROWS&&c<COLS&&zoneAt(r,c)===me&&!m.has(r+','+c))}
function randomPlace(){
  const me=myId();
  for(let a=0;a<400;a++){
    const f=L.fleet.map(s=>({...s,cells:null})),occ=new Set();let ok=true;
    const idx=f.map((_,i)=>i).sort((x,y)=>f[y].len-f[x].len);
    for(const i of idx){
      let placed=false;
      for(let t=0;t<200&&!placed;t++){
        const [r,c]=ZCELLS[me][rand(ZCELLS[me].length)];
        const cs=cellsFor(f[i].len,r,c,rand(2)===0);
        if(cs.every(([rr,cc])=>rr<ROWS&&cc<COLS&&zoneAt(rr,cc)===me&&!occ.has(rr+','+cc))){cs.forEach(([rr,cc])=>occ.add(rr+','+cc));f[i].cells=cs;placed=true}
      }
      if(!placed){ok=false;break}
    }
    if(ok){L.fleet=f;L.sel=null;return true}
  }
  return false;
}
const nextUnplaced=()=>{const i=L.fleet.findIndex(s=>!s.cells);return i<0?null:i};
function pickHTML(){
  const b=myBudget(),left=b-spent();
  return `<div class="pts"><span>Puntos de flota (según tu territorio)</span><span><b>${left}</b> / ${b}</span></div><div class="shop">${SHIPS.map(s=>{
    const q=L.comp[s.k]||0;
    return `<div class="row"><div class="nm">${s.n}<small>${s.len} casillas · cuesta ${s.cost} pts</small><div class="blks">${'<i class="blk"></i>'.repeat(s.len)}</div></div><div class="qty"><button data-act="dec" data-k="${s.k}" ${q<=0?'disabled':''}>−</button><b>${q}</b><button data-act="inc" data-k="${s.k}" ${q>=s.max||left<s.cost?'disabled':''}>+</button></div></div>`}).join('')}
  <button class="btn big" data-act="toplace" ${countShips()<1?'disabled':''} style="margin-top:6px">Colocar flota →</button></div>`;
}
function placeMapHTML(){
  const me=myId(),b=zbox(me),D={t:{},shot:new Map(),last:null};
  D.t[me]={ships:L.fleet.filter(s=>s.cells).map(s=>({...s,sunk:false})),left:0,total:0,alive:true};
  return `<div class="mapwrap" id="pmap">${mapSVG({view:b,D,own:me,dim:me,rects:true,shots:false})}</div>`;
}
function placeHTML(locked){
  const all=L.fleet.every(s=>s.cells);
  return `<div class="place"><div><div class="panel"><h3>Tu flota</h3><ul class="fl">${L.fleet.map((s,i)=>`<li class="${i===L.sel?'on':''} ${s.cells?'done':''}" ${locked?'':`data-act="selship" data-i="${i}"`}><span>${SHIP[s.k].n} <small>(${s.len})</small></span><span>${s.cells?'✓':'○'}</span></li>`).join('')}</ul>
  ${locked?`<p class="muted">¡Flota lista! Esperando a los demás equipos…</p><button class="btn sec" data-act="unready" style="width:100%">✏️ Editar flota</button>`:`<div class="ctrls"><button class="btn sec" data-act="rotate">🔄 ${L.horiz?'Horizontal':'Vertical'}</button><button class="btn sec" data-act="random">🎲 Aleatorio</button><button class="btn sec" data-act="clear">🧹 Limpiar</button><button class="btn sec" data-act="back">← Flota</button></div><button class="btn big" data-act="ready" style="width:100%" ${all?'':'disabled'}>⚓ ¡Listo!</button><p class="muted" style="margin-top:10px">Selecciona un barco y toca el mapa dentro de la zona iluminada de tu continente. Toca un barco ya puesto para moverlo. Tecla <b>R</b> para girar.</p>`}</div></div>
  <div><div id="pwrap">${placeMapHTML()}</div><p class="stat" id="sstat"></p></div></div>`;
}
function renderSetup(){
  const me=myId(),t=me&&st().teams[me];if(!t||!$('#sbody'))return;
  const locked=!!t.ready;L.flag=locked;
  $('#sbody').innerHTML=(L.stage==='pick'&&!locked)?pickHTML():placeHTML(locked);
}
function paintPreview(){
  $$('#pmap .pc').forEach(c=>c.classList.remove('pv','pvbad'));
  if(L.sel==null||!L.hover)return;
  const me=myId(),t=me&&st().teams[me];if(!t||t.ready)return;
  const sh=L.fleet[L.sel];if(!sh||sh.cells)return;
  const cs=cellsFor(sh.len,L.hover[0],L.hover[1],L.horiz),ok=validPlace(cs);
  cs.forEach(([r,c])=>{const el=$(`#pmap .pc[data-r="${r}"][data-c="${c}"]`);if(el)el.classList.add(ok?'pv':'pvbad')});
}

function setupCell(cell){
  const me=myId(),t=me&&st().teams[me];if(!t||t.ready)return;
  const r=+cell.dataset.r,c=+cell.dataset.c,m=occMap();
  if(m.has(r+','+c)){const i=m.get(r+','+c);L.fleet[i].cells=null;L.sel=i}
  else if(L.sel!=null&&L.fleet[L.sel]&&!L.fleet[L.sel].cells){
    const cs=cellsFor(L.fleet[L.sel].len,r,c,L.horiz);
    if(validPlace(cs)){L.fleet[L.sel].cells=cs;L.sel=nextUnplaced()}
    else{toast('No cabe ahí: usa solo la zona iluminada de tu continente');return}
  }else{toast('Selecciona primero un barco de la lista');return}
  renderSetup();views['team-setup'].update();
}

/* ================== ruteo ================== */
function route(){
  if(!role)return 'landing';
  if(role==='host'){
    if(H.status==='choose')return 'host-choose';
    if(H.status!=='ok')return 'host-boot';
    return st().phase==='setup'?'host-setup':'host-battle';
  }
  if(!CL.code)return 'team-code';
  if(!P)return 'team-connecting';
  if(!myId()){CL.myFleet=null;return 'team-join'}
  return st().phase==='setup'?'team-setup':'team-battle';
}
let rq=false;
function render(){
  if(rq)return;rq=true;
  requestAnimationFrame(()=>{
    rq=false;
    const v=route();
    if(v!==curView){curView=v;views[v].mount()}
    views[v].update();
    const dot=$('.dbdot');if(dot)dot.classList.toggle('ok',connOk());
    if(P){
      const s=st();
      if(prevPhase==='setup'&&s.phase==='battle')showOrder(s.order);
      if(prevPhase==='over'&&s.phase==='setup')$('#ov').classList.remove('on');
      if(role==='team'&&myId()&&s.phase==='battle'&&s.turn===myId()&&prevTurn!==s.turn){try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}}
      prevPhase=s.phase;prevTurn=s.turn;
    }
  });
}
function setRole(r){
  if(role==='host')leaveHost();
  if(role==='team')leaveTeam();
  role=r;ssSet('bn_role',r);curView=null;prevPhase=null;prevTurn=null;
  if(r==='host'){if(lsJSON('bn_host')){H.status='choose'}else startHost(false)}
  render();
}

/* ================== eventos ================== */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){
    const act=a.dataset.act;
    switch(act){
      case 'pickHost':setRole('host');break;
      case 'pickTeam':setRole('team');break;
      case 'switch':setRole(null);break;
      case 'hostResume':startHost(true);break;
      case 'hostNew':startHost(false);break;
      case 'hostRetry':startHost(!!lsJSON('bn_host'));break;
      case 'entercode':{const v=(($('#codein')||{}).value||'').trim().toUpperCase();if(v.length<3){toast('Escribe el código');break}setCode(v);break}
      case 'changecode':leaveTeam();curView=null;render();break;
      case 'closeov':$('#ov').classList.remove('on');break;
      case 'claim':{const name=(($('#tname')||{}).value||'').trim();if(!csend({t:'join',cont:a.dataset.c,name,token:CL.token}))toast('Sin conexión con la partida');break}
      case 'inc':{const s=SHIP[a.dataset.k];if(spent()+s.cost<=myBudget()&&(L.comp[s.k]||0)<s.max){L.comp[s.k]=(L.comp[s.k]||0)+1;renderSetup()}break}
      case 'dec':{const k=a.dataset.k;if((L.comp[k]||0)>0){L.comp[k]--;renderSetup()}break}
      case 'toplace':buildFleet();L.stage='place';renderSetup();views['team-setup'].update();break;
      case 'back':L.stage='pick';renderSetup();break;
      case 'selship':{const i=+a.dataset.i;if(L.fleet[i].cells)L.fleet[i].cells=null;L.sel=i;renderSetup();views['team-setup'].update();break}
      case 'rotate':L.horiz=!L.horiz;renderSetup();views['team-setup'].update();break;
      case 'random':if(!randomPlace())toast('No se pudo acomodar, intenta de nuevo');renderSetup();views['team-setup'].update();break;
      case 'clear':L.fleet.forEach(s=>s.cells=null);L.sel=0;renderSetup();views['team-setup'].update();break;
      case 'ready':if(L.fleet.every(s=>s.cells)){if(csend({t:'ready',fleet:L.fleet.map(s=>({k:s.k,len:s.len,cells:s.cells}))}))a.disabled=true;else toast('Sin conexión con la partida')}break;
      case 'unready':csend({t:'unready'});break;
      case 'zoom':{const z=+a.dataset.z;TB.zoom=z===0?1:Math.max(1,Math.min(4,TB.zoom+z*0.75));views['team-battle'].update();break}
      case 'fire':fire();break;
      case 'start':startBattle();break;
      case 'skip':skipTurn();break;
      case 'expAtaques':exportAtaques();break;
      case 'expFlotas':exportFlotas();break;
      case 'expJSON':exportJSON();break;
      case 'reset':{
        const b=$('#resetBtn');
        if(!hostResetArmed){hostResetArmed=true;if(b)b.textContent='¿Seguro? Pulsa otra vez';setTimeout(()=>{hostResetArmed=false;const bb=$('#resetBtn');if(bb)bb.textContent='🔄 Nueva partida'},4000)}
        else{hostResetArmed=false;resetGame()}
        break}
      case 'reset2':resetGame();break;
    }
    return;
  }
  const cell=e.target.closest&&e.target.closest('#pmap .pc');
  if(cell)setupCell(cell);
});
document.addEventListener('change',e=>{
  if(role!=='host'||!H.G)return;
  if(e.target.id==='again'){H.G.again=e.target.checked;bcast()}
  else if(e.target.id==='eq'){H.G.eq=e.target.checked;bcast()}
  else if(e.target.id==='preview'){H.G.preview=e.target.checked;bcast()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='coord'&&st().preview){const p=parseCoord(e.target.value);TB.pv=p.ok?[p.r,p.c]:null;views['team-battle'].update()}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='coord'&&e.key==='Enter'){e.preventDefault();fire();return}
  if((e.key==='r'||e.key==='R')&&curView==='team-setup'&&!/INPUT|TEXTAREA/.test(e.target.tagName||'')){L.horiz=!L.horiz;renderSetup();views['team-setup'].update();paintPreview()}
});
document.addEventListener('mouseover',e=>{
  const cell=e.target.closest&&e.target.closest('#pmap .pc');
  if(cell){L.hover=[+cell.dataset.r,+cell.dataset.c];paintPreview()}
});
document.addEventListener('mouseout',e=>{
  if(e.target.closest&&e.target.closest('#pmap')&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('#pmap'))){L.hover=null;paintPreview()}
});

/* ================== arranque ================== */
function init(){
  const url=new URLSearchParams(location.search).get('c');
  const r=ssGet('bn_role');
  document.body.insertAdjacentHTML('afterbegin',mapDefs());
  if(typeof Peer==='undefined'){
    $('#app').innerHTML='<div class="center"><div><div style="font-size:2.5rem">⚠️</div><p>No se pudo cargar la librería de conexión (PeerJS).<br>Revisa tu conexión a internet y recarga.</p></div></div>';
    return;
  }
  if(url){role='team';ssSet('bn_role','team');CL.code=url.trim().toUpperCase();ssSet('bn_code',CL.code);clientConnect()}
  else if(r==='host'){role='host';if(lsJSON('bn_host'))startHost(true);else startHost(false)}
  else if(r==='team'){role='team';const c=ssGet('bn_code');if(c){CL.code=c;clientConnect()}}
  render();
}
init();
window.__bn={parseCoord,ZCELLS,zoneAt,budgetOf};
})();

</script>
